# loadout — NGUỒN SỰ THẬT DUY NHẤT CỦA ACL cho vai này.
# Sửa file này rồi chạy: scripts/compile-acl.sh
# .claude/settings.json là SẢN PHẨM SINH RA — không sửa tay, không commit.

# --- danh tính (không ảnh hưởng ACL) ---
role: oracle
name: Oracle
emoji: 🔮
model: gpt-5.6-sol
# Runtime routing: Main trên Claude → claude-opus-5; Main trên Codex → model mặc định trên.

# --- quan hệ ---
reports_to: main
delegates_to: []

# --- ACL: đường dẫn tương đối tính từ memory/ ---
# private/oracle/** tự thêm vào cả read lẫn write — không cần khai.
memory:
  read:  [shared/**, projects/**]
  write: []

# --- workspace code ngoài alp-code (viết dạng `~/...`) ---
workspaces:
  read:  [~/StudioProjects/alp-plugin]
  write: []

# --- công cụ & skill ---
tools:  [Read, Glob, Grep, Bash, WebSearch, WebFetch]
skills: [agent-memory]
