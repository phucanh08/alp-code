# loadout — NGUỒN SỰ THẬT DUY NHẤT CỦA ACL cho vai này.
# Sửa file này rồi chạy: scripts/compile-acl.sh
# .claude/settings.json là SẢN PHẨM SINH RA — không sửa tay, không commit.

# --- danh tính (không ảnh hưởng ACL) ---
role: librarian
name: Librarian
emoji: 📚
model: gpt-5.6-sol

# --- quan hệ ---
reports_to: main
delegates_to: []

# --- ACL: đường dẫn tương đối tính từ memory/ ---
# private/librarian/** tự thêm vào cả read lẫn write — không cần khai.
memory:
  read:  [shared/**, projects/**]
  write: [shared/reference/**, projects/**/refs/**]

# --- workspace code ngoài alp-code (viết dạng `~/...`) ---
workspaces:
  read:  []
  write: []

# --- công cụ & skill ---
tools:  [Read, Glob, Grep, Bash, WebSearch, WebFetch, Skill]
skills: [agent-memory, research, docs-seeker]
