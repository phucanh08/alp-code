# loadout — NGUỒN SỰ THẬT DUY NHẤT CỦA ACL cho vai này.
# Sửa file này rồi chạy: scripts/compile-acl.sh
# .claude/settings.json là SẢN PHẨM SINH RA — không sửa tay, không commit.

# --- danh tính (không ảnh hưởng ACL) ---
role: main
name: Phở
emoji: 🍜
model: claude-opus-5
# Runtime CHÍNH của main là Claude. Codex chỉ là đường phụ tiết kiệm quota — nó không nạp
# được `alp:plan`/`alp:cook` (marketplace của Claude Code). `run-role main` dùng model dưới.
codex_model: gpt-5.6-sol

# --- quan hệ ---
reports_to: principal
delegates_to: [search, librarian, read-thread, review, oracle, compaction, titling]

# --- ACL: đường dẫn tương đối tính từ memory/ ---
# private/main/** tự thêm vào cả read lẫn write — không cần khai.
memory:
  read:  [shared/**, projects/**]
  write: [shared/**, projects/**]

workspaces:
  read:  [~/StudioProjects/alp-plugin]
  write: [~/StudioProjects/alp-plugin]

# --- công cụ & skill ---
tools:  [Read, Write, Edit, Glob, Grep, Bash, WebSearch, WebFetch]
skills: [agent-memory, herdr, alp:plan, alp:cook]
