# loadout — NGUỒN SỰ THẬT DUY NHẤT CỦA ACL cho vai này.
# Sửa file này rồi chạy: scripts/compile-acl.sh
# .claude/settings.json là SẢN PHẨM SINH RA — không sửa tay, không commit.

# --- danh tính (không ảnh hưởng ACL) ---
role: review
name: Review
emoji: 🔎
model: gpt-5.5
reasoning_effort: medium

# --- quan hệ ---
reports_to: main
delegates_to: []

# --- ACL: đường dẫn tương đối tính từ memory/ ---
# private/review/** tự thêm vào cả read lẫn write — không cần khai.
memory:
  read:  [shared/**, projects/**]
  write: []

# --- workspace code ngoài alp-code (viết dạng `~/...`) ---
workspaces:
  read:  [~/StudioProjects/alp-plugin]
  write: []

# --- công cụ & skill ---
tools:  [Read, Glob, Grep, Bash]
skills: [agent-memory, code-review, alp-scenario, security-scan]
